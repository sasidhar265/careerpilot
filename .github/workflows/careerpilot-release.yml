name: CareerPilot release verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: careerpilot_test
          POSTGRES_USER: careerpilot_test
          POSTGRES_PASSWORD: ephemeral-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerpilot_test -d careerpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Isolated service credentials; never production secrets or data.
      DATABASE_URL: postgresql://careerpilot_test:ephemeral-test-only@localhost:5432/careerpilot_test
      INTEGRATION_DATABASE_URL: postgresql://careerpilot_test:ephemeral-test-only@localhost:5432/careerpilot_test
      E2E_DATABASE_URL: postgresql://careerpilot_test:ephemeral-test-only@localhost:5432/careerpilot_test
      E2E_PROVIDER_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require reviewed application lockfile
        run: test -f apps/careerpilot/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/careerpilot ci
      - run: npm --prefix apps/careerpilot run db:generate
      - run: npm --prefix apps/careerpilot run db:migrate
      - run: npm --prefix apps/careerpilot run typecheck
      - run: npm --prefix apps/careerpilot run lint
      - run: npm test
      - run: npm --prefix apps/careerpilot test
      - run: npm --prefix apps/careerpilot run test:integration:required
      - run: npm --prefix apps/careerpilot run build
      - name: Install browser
        working-directory: apps/careerpilot
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm --prefix apps/careerpilot run test:e2e
      - run: npm --prefix apps/careerpilot run test:e2e:journey
      - name: Dependency advisory gate
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix apps/careerpilot audit --omit=dev --audit-level=high
      - name: Production image and database readiness smoke
        run: |
          docker build -f apps/careerpilot/Dockerfile -t careerpilot-release:ci .
          docker run --detach --name careerpilot-release --network host --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e DATABASE_URL -e APP_URL=http://localhost:3100 careerpilot-release:ci
          trap 'docker rm -f careerpilot-release' EXIT
          curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:3100/api/health
